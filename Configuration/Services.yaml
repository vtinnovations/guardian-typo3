services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Auto-register application/infrastructure/integration classes. The Domain
  # namespace is excluded because it is made of pure value objects, enums and
  # exceptions that must never be treated as services; the three dependency-free
  # domain *services* it does contain are registered explicitly below.
  Vtinnovations\GuardianTypo3\:
    resource: '../Classes/*'
    exclude:
      # Pure value objects, enums and exceptions — never services.
      - '../Classes/Domain/*'
      # Application-layer read model (value object), constructed by services.
      - '../Classes/Application/Schedule/ScheduleForecast.php'
      # Instantiated by its factory with a runtime path, not autowired.
      - '../Classes/Infrastructure/Lock/FlockLock.php'
      # Built by hand with resolved php/composer/project paths, never autowired.
      - '../Classes/Application/Update/ComposerCommandFactory.php'
      # Standalone recovery-panel runtime: hand-wired by StandaloneRecoveryKernel
      # from the panel's disk location, never resolved through the container.
      - '../Classes/Recovery/Standalone/*'

  # Pure, dependency-free domain services that are injected elsewhere.
  Vtinnovations\GuardianTypo3\Domain\Filesystem\PathNormalizer: ~
  Vtinnovations\GuardianTypo3\Domain\Archive\ArchiveEntryValidator: ~
  Vtinnovations\GuardianTypo3\Domain\Schedule\ScheduleEvaluator: ~

  # The backend module controller and the AJAX controller are resolved by
  # TYPO3's module/AJAX routing, so they must be publicly retrievable.
  Vtinnovations\GuardianTypo3\Controller\Backend\GuardianModuleController:
    public: true

  Vtinnovations\GuardianTypo3\Controller\Backend\GuardianAjaxController:
    public: true

  # Host of the shared V-T.ONE licence screen, resolved by module routing.
  Vtinnovations\GuardianTypo3\Controller\Backend\PackageOverviewController:
    public: true

  # This product's section of that screen. The shared host resolves registered
  # sections from the container by class name, so it must be retrievable.
  Vtinnovations\GuardianTypo3\Typo3\Backend\GuardianPackageSection:
    public: true

  # Frontend PSR-15 middleware serving Guardian's one machine-facing REST path.
  # TYPO3's middleware dispatcher resolves it through the container, so it must
  # be public.
  Vtinnovations\GuardianTypo3\Middleware\RestEndpointMiddleware:
    public: true

  # Console command (run due scheduled backups from cron / the TYPO3 Scheduler).
  Vtinnovations\GuardianTypo3\Command\RunDueBackupsCommand:
    public: true
    tags:
      - { name: 'console.command', command: 'guardian:backup:run-due' }

  # Console worker that runs a queued update job (spawned by the backend).
  Vtinnovations\GuardianTypo3\Command\RunUpdateJobCommand:
    public: true
    tags:
      - { name: 'console.command', command: 'guardian:update:run' }

  # Detached worker that performs the deferred Guardian self-disable.
  Vtinnovations\GuardianTypo3\Command\RunSelfMaintenanceCommand:
    public: true
    tags:
      - { name: 'console.command', command: 'guardian:self-maintenance:run' }

  # Build gate: refuses to bless a package whose verification keys are missing.
  Vtinnovations\GuardianTypo3\Command\ReleaseCheckCommand:
    public: true
    tags:
      - { name: 'console.command', command: 'guardian:release:check' }

  # ── Port → adapter bindings ────────────────────────────────────────────────
  Vtinnovations\GuardianTypo3\Domain\Clock\ClockInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Clock\SystemClock

  # TER (TYPO3 Extension Repository) HTTPS transport → strict RequestFactory impl.
  Vtinnovations\GuardianTypo3\Infrastructure\Ter\TerHttpTransportInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Ter\RequestFactoryTerTransport

  # Enable/Disable go through TYPO3's supported package API (never file edits).
  Vtinnovations\GuardianTypo3\Application\Contract\Typo3ExtensionStateInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Package\Typo3CorePackageService

  # Deferred self-maintenance worker spawner.
  Vtinnovations\GuardianTypo3\Application\Contract\DeferredWorkerSpawnerInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\SelfMaintenance\SelfMaintenanceSpawner

  Vtinnovations\GuardianTypo3\Application\Contract\ProjectEnvironmentInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Environment\Typo3ProjectEnvironment

  Vtinnovations\GuardianTypo3\Application\Contract\WorkingDirectoryProviderInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Paths\GuardianPaths

  Vtinnovations\GuardianTypo3\Application\Contract\BackendAuthorizationInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Authorization\BackendUserAuthorization

  Vtinnovations\GuardianTypo3\Application\Contract\SystemLoggerInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Logging\Typo3SystemLogger

  Vtinnovations\GuardianTypo3\Application\Contract\SchedulerIntegrationInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Scheduler\Typo3SchedulerIntegration

  Vtinnovations\GuardianTypo3\Application\Contract\RuntimeConfigurationRepositoryInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Configuration\JsonRuntimeConfigurationRepository

  Vtinnovations\GuardianTypo3\Application\Contract\ServiceRecordStoreInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Configuration\SealedRecordStore

  Vtinnovations\GuardianTypo3\Application\Contract\RecordExchangeInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Registry\RecordExchangeClient

  Vtinnovations\GuardianTypo3\Application\Contract\InstallationIdentityInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Environment\InstallationIdentity

  # The configured-host inventory comes from TYPO3 Site Configuration, never from
  # request data.
  Vtinnovations\GuardianTypo3\Application\Contract\ConfiguredHostsInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Environment\SiteHostInventory

  # Once-per-session claim, held in the authenticated backend session.
  Vtinnovations\GuardianTypo3\Application\Contract\SessionEntryClaimInterface:
    alias: Vtinnovations\GuardianTypo3\Typo3\Environment\BackendSessionClaim

  Vtinnovations\GuardianTypo3\Infrastructure\Registry\Transport\PingTransportInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Registry\Transport\CurlPingTransport

  Vtinnovations\GuardianTypo3\Infrastructure\Registry\Transport\ExchangeTransportInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Registry\Transport\RequestFactoryExchangeTransport

  Vtinnovations\GuardianTypo3\Application\Contract\ScheduleRepositoryInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Schedule\JsonScheduleRepository

  Vtinnovations\GuardianTypo3\Application\Contract\LockFactoryInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Lock\FlockLockFactory

  # Phase 1 ships only the refuse-to-run executor; a shell-free real executor is
  # introduced in the update/backup phases.
  Vtinnovations\GuardianTypo3\Application\Contract\CommandExecutorInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Process\UnavailableCommandExecutor

  # ── Backup subsystem bindings ──────────────────────────────────────────────
  Vtinnovations\GuardianTypo3\Application\Contract\DatabaseDumperInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Database\Typo3DatabaseDumper

  Vtinnovations\GuardianTypo3\Application\Contract\MailerInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Notification\Typo3Mailer

  Vtinnovations\GuardianTypo3\Application\Contract\ScheduleConfigStoreInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Schedule\JsonScheduleConfigStore

  # ── Recovery subsystem bindings ────────────────────────────────────────────
  Vtinnovations\GuardianTypo3\Application\Contract\DatabaseImporterInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Database\Typo3DatabaseImporter

  Vtinnovations\GuardianTypo3\Application\Contract\MaintenanceModeInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Maintenance\FileMaintenanceMode

  Vtinnovations\GuardianTypo3\Application\Contract\RecoveryHistoryStoreInterface:
    alias: Vtinnovations\GuardianTypo3\Infrastructure\Recovery\JsonRecoveryHistoryStore
